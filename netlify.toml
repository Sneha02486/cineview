"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# API routing to Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server"
  status = 200
  force = true

# SPA history fallback for React Router navigation
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


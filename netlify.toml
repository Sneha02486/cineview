
[build]
  command = "npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "24"

# Client-side routes fall back to the SPA shell. /api/* is handled by the
# Netlify Server (netlify/server/index.ts), so it must not be rewritten here.
[[redirects]]
  from = "/movie/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/seats/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/preview-3d/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/booking/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/confirmation/*"
  to = "/index.html"
  status = 200
